version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    groups:
      minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint"
          - "typescript"
    labels:
      - "dependencies"
    ignore:
      # typescript-eslint (via eslint-config-next) does not support TS 7 yet:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        versions: [">=7"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
