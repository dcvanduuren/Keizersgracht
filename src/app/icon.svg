<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <!-- Top Sky Gradient: Soft Coral Wash -->
    <linearGradient id="sunset-sky" x1="128" y1="12" x2="128" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2683C" />
      <stop offset="55%" stop-color="#F69271" />
      <stop offset="100%" stop-color="#F9BCA5" />
    </linearGradient>

    <!-- Bottom Water Gradient: Mineral Aqua Wash -->
    <linearGradient id="sunset-water" x1="128" y1="131" x2="128" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B8D2CE" />
      <stop offset="50%" stop-color="#8DB2B6" />
      <stop offset="100%" stop-color="#699399" />
    </linearGradient>

    <!-- Clip Path for the Rounded Icon Container -->
    <clipPath id="icon-clip">
      <rect x="12" y="12" width="232" height="232" rx="14" />
    </clipPath>
  </defs>

  <!-- Main Clipped Container -->
  <g clip-path="url(#icon-clip)">
    <!-- Sky Top Half -->
    <rect x="12" y="12" width="232" height="113" fill="url(#sunset-sky)" />

    <!-- Setting Sun Semicircle (Canvas #F5F4ED) -->
    <path d="M 73 125 A 55 55 0 0 1 183 125 Z" fill="#F5F4ED" />

    <!-- Horizon Gap Bar (Canvas #F5F4ED) -->
    <rect x="12" y="125" width="232" height="6" fill="#F5F4ED" />

    <!-- Water Bottom Half -->
    <rect x="12" y="131" width="232" height="113" fill="url(#sunset-water)" />

    <!-- Horizon Hairline Dividers (Terracotta #733635) -->
    <line x1="12" y1="125" x2="244" y2="125" stroke="#733635" stroke-width="1.5" />
    <line x1="12" y1="131" x2="244" y2="131" stroke="#733635" stroke-width="1.5" />

    <!-- Upper S-Curve Data Pathway (Dotted) -->
    <path d="M 12 162 H 92 C 128 162, 128 101, 164 101 H 244" 
          stroke="#351E10" stroke-width="2" stroke-linecap="round" stroke-dasharray="2.5 4.5" />

    <!-- Lower S-Curve Data Pathway (Dotted) -->
    <path d="M 12 181 H 104 C 134 181, 134 147, 164 147 H 244" 
          stroke="#351E10" stroke-width="2" stroke-linecap="round" stroke-dasharray="2.5 4.5" />
  </g>

  <!-- Outer Architectural Border -->
  <rect x="12" y="12" width="232" height="232" rx="14" stroke="#733635" stroke-width="1.75" />

  <!-- Workflow Nodes (Espresso #351E10) -->
  <!-- Left Edge & Interior Nodes -->
  <circle cx="12" cy="162" r="3.5" fill="#351E10" />
  <circle cx="67" cy="162" r="3.5" fill="#351E10" />
  <circle cx="12" cy="181" r="3.5" fill="#351E10" />

  <!-- Right Edge & Interior Nodes -->
  <circle cx="195" cy="101" r="3.5" fill="#351E10" />
  <circle cx="244" cy="101" r="3.5" fill="#351E10" />
  <circle cx="191" cy="147" r="3.5" fill="#351E10" />
  <circle cx="244" cy="147" r="3.5" fill="#351E10" />
</svg>
